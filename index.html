<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inson va Fenomen — Konkurs platformasi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#F1EEE6;--panel:#FAF8F3;--card:#fff;--border:#E2DDD1;--text:#1B1B1F;--muted:#6B6A66;--blue:#2F55D4;--orange:#BE5430;--red:#C0392B;--green:#2E7D4F;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--panel:#1C1B18;--card:#24231F;--border:#36342E;--text:#F2EFE8;--muted:#A9A69C;--blue:#4A6BE0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141311;--panel:#1C1B18;--card:#24231F;--border:#36342E;--text:#F2EFE8;--muted:#A9A69C;--blue:#4A6BE0;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.serif,h1,h2{font-family:'Playfair Display','Times New Roman',serif;font-weight:400}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 96px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4}
.top h1{font-size:20px;margin:0}
.lnk{background:none;border:0;color:var(--blue);font-size:13px;font-weight:500;cursor:pointer;padding:6px 0}
input,select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:8px;font-size:14px;margin-bottom:8px;font-family:inherit}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:12px 16px;font-weight:500;cursor:pointer;font-size:14px;font-family:inherit}
.btn.o{background:var(--orange)}.btn.r{background:var(--red)}.btn.g{background:var(--green)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}
.auth{max-width:380px;margin:0 auto;padding:30px 20px}
.bar{display:flex;gap:4px;margin-bottom:46px}.bar i{flex:1;height:2px;background:var(--border)}.bar i:first-child{background:var(--blue)}
.auth h1{font-size:34px;text-align:center;margin:0 0 8px}
.sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 24px}
.err{color:var(--red);font-size:13px;min-height:18px;margin:0 0 8px}
.hero{position:relative;height:150px;border-radius:14px;overflow:hidden;background:linear-gradient(120deg,#17171B,#34323A 62%,#2F55D4 140%);color:#fff;margin-bottom:14px}
.hero h2{position:absolute;left:18px;top:34px;margin:0;font-size:30px;line-height:1.05}
.hero small{position:absolute;left:18px;bottom:14px;opacity:.8;font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.cd{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px;margin-bottom:14px}
.md{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff}
.md img,.md video{width:100%;height:100%;object-fit:cover}
.pl{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(20,20,24,.72);pointer-events:none}
.pl:after{content:"";position:absolute;left:18px;top:14px;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.tg{display:inline-block;padding:3px 9px;border-radius:5px;color:#fff;font-size:11px;font-weight:500;background:var(--orange)}
.tg.b{background:var(--blue)}.tg.k{background:#17171B}
.ct{font-size:16px;font-weight:500;margin:8px 0 4px;line-height:1.3}
.by{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-bottom:8px}
.av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;flex:0 0 auto}
.ac{display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:8px}
.ac button{background:none;border:0;color:var(--text);font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 4px;font-family:inherit}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.f{fill:var(--orange);stroke:var(--orange)}
.cm{font-size:13px;color:var(--muted);padding:3px 2px}.cm b{color:var(--text);font-weight:500}
.cin{display:flex;gap:8px;margin-top:6px}.cin input{margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;color:#fff}
.tile img,.tile video{width:100%;height:100%;object-fit:cover}
.ov{position:absolute;left:0;right:0;bottom:0;padding:34px 10px 10px;font-size:13px;background:linear-gradient(transparent,rgba(15,15,18,.82))}
.ov small{display:block;opacity:.85;font-size:11px;margin-top:2px}
.big{aspect-ratio:16/10;margin-bottom:10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--border);z-index:6}
.nav div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 8px;font-family:inherit}
.nav button.on{color:var(--blue)}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;color:#fff;white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:13px}
.item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px}
.th{width:54px;height:54px;border-radius:8px;overflow:hidden;flex:0 0 auto;background:#555}.th img{width:100%;height:100%;object-fit:cover}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin:12px 0}.chk input{width:auto;margin:0}
h3.sec{font-size:22px;margin:6px 0 10px;font-family:'Playfair Display',serif;font-weight:400}
.adm{max-width:640px;margin:0 auto;padding:16px}
.load{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:7px 14px;border-radius:99px;font-size:12px;z-index:9;display:none}
.dl{font-size:12px;color:var(--blue);text-decoration:none}
.md .ph,.tile .ph{opacity:.85;font-size:13px}
</style>
</head>
<body>
<div id="load" class="load">Yuklanmoqda…</div>
<div id="app"></div>
<script>
// ====== Apps Script Web App URL (Deploy qilingandan keyin qo'ying) ======
const API="https://script.google.com/macros/s/AKfycbygWMJbudl7rEkt4eq_IvNz4oyjQ6qOlMrG6vJ48b95MJiD2vWa8jB6KLOKjA7v1Hf7/exec";
const MAX_MB=25;
// O'zbekiston mobil operator kodlari (+998 dan keyingi 2 raqam). Yangi kod chiqsa shu yerga qo'shing (Code.gs da ham!)
const UZ_CODES=["20","33","50","70","77","80","87","88","90","91","93","94","95","97","98","99"];

const NAME="Inson va Fenomen";
const G=["linear-gradient(135deg,#1A1A1E,#5B5B63)","linear-gradient(135deg,#BE5430,#E39A74 60%,#F0D9C4)","radial-gradient(circle at 65% 50%,#C2905A,#1A120D 70%)","linear-gradient(135deg,#8C7B6A,#D8CDBE)","linear-gradient(120deg,#7A4A32,#C99468 45%,#E9E3D8)"];
const CATS={foto:["Fotografiya","o"],art:["Raqamli san’at","o"],film:["Qisqa film","b"],esse:["Esse","k"]};
const COMPS=["Inson va Fenomen 2026","Qishki manzaralar","Shahar ovozlari"];
const P={home:"M3 11l9-8 9 8v10h-6v-6H9v6H3z",explore:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',add:"M12 16V4m0 0L7 9m5-5l5 5M4 20h16",mag:"M4 5h6a2 2 0 012 2v12a2 2 0 00-2-2H4zM20 5h-6a2 2 0 00-2 2v12a2 2 0 012-2h6z",me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',heart:"M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z",cmt:"M4 5h16v11H9l-5 4z",share:"M4 12v7h16v-7M12 3v12M7 8l5-5 5 5",doc:"M6 3h9l4 4v14H6zM14 3v5h5"};
const ic=(n,c)=>`<svg class="ic ${c||""}" viewBox="0 0 24 24" aria-hidden="true">${P[n].startsWith("<")?P[n]:`<path d="${P[n]}"/>`}</svg>`;

let me=null,token=null,tab="home",cat=null,open={},mode="login",posts=[],adm=null,busy=false;
try{me=localStorage.getItem("me");token=localStorage.getItem("token");if(!me||!token){me=token=null}}catch(e){}

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const avc=n=>["#B9744F","#2F55D4","#2E7D4F","#7A4A32","#6B5F8A"][(String(n).charCodeAt(0)||0)%5];
const ava=(n,s)=>`<span class="av" style="background:${avc(n)};${s||""}">${esc(String(n)[0]||"?").toUpperCase()}</span>`;
const tag=c=>CATS[c]?`<span class="tg ${CATS[c][1]}">${CATS[c][0]}</span>`:"";
const catName=c=>CATS[c]?CATS[c][0]:c;
const kfmt=n=>n>=1000?(n/1000).toFixed(1)+"k":n;
const gi=id=>Number(id)%G.length;
const isAdmin=()=>location.hash==="#daxshat";
const approved=()=>posts.filter(p=>p.status=="approved");

// ====== API ======
async function api(action,data={},quiet){
  if(!quiet){$("load").style.display="block"}
  try{
    const r=await fetch(API,{method:"POST",body:JSON.stringify({action,...data})}); // text/plain → CORS preflight yo'q
    const j=await r.json();
    if(!j.ok){
      if(/Sessiya/.test(j.error)&&action!="logout"){clearSession();render()}
      throw new Error(j.error);
    }
    return j;
  }catch(e){
    throw new Error(e.message=="Failed to fetch"?"Server bilan aloqa yo‘q":e.message);
  }finally{$("load").style.display="none"}
}
const A=(action,data,q)=>api(action,{user:me,token,...data},q);
function saveSession(){try{localStorage.setItem("me",me);localStorage.setItem("token",token)}catch(e){}}
function clearSession(){me=token=null;posts=[];try{localStorage.removeItem("me");localStorage.removeItem("token")}catch(e){}}
async function loadFeed(){try{posts=(await A("feed")).posts}catch(e){alert(e.message)}render()}

function media(p){
  if(p.preview&&p.type=="image") return `<img src="${esc(p.preview)}" alt="" loading="lazy" referrerpolicy="no-referrer">`;
  return p.type=="doc"?ic("doc"):p.type=="image"?"":"";
}

const TABS=[["home","Bosh sahifa"],["explore","Qidiruv"],["add","Yuklash"],["mag","Jurnal"],["me","Profil"]];
function render(){
  if(isAdmin()) return renderAdmin();
  if(!me) return renderAuth();
  const v={home:homeView,explore:exploreView,add:addView,mag:magView,me:profileView}[tab]();
  $("app").innerHTML=`<div class="wrap"><div class="top"><button class="lnk" style="width:50px;text-align:left" onclick="loadFeed()">Yangilash</button><h1>${NAME}</h1><button class="lnk" onclick="logout()">Chiqish</button></div>${v}</div>
  <nav class="nav"><div>${TABS.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="go('${t[0]}')">${ic(t[0])}${t[1]}</button>`).join("")}</div></nav>`;
}
function go(t){tab=t;window.scrollTo(0,0);render()}

// ====== Kirish / Ro'yxatdan o'tish ======
function renderAuth(){
  const L=mode=="login";
  $("app").innerHTML=`<div class="auth"><div class="bar"><i></i><i></i><i></i></div><h1>${NAME}</h1>
  <p class="sub">${L?"Ijodiy tanlovlar va jurnal platformasiga kiring":"Tanlovda qatnashish uchun ro‘yxatdan o‘ting"}</p>
  <input id="a-name" placeholder="Foydalanuvchi nomi" autocapitalize="none" autocomplete="username">
  ${L?"":'<input id="a-phone" type="tel" inputmode="tel" value="+998" maxlength="13" placeholder="+998901234567" autocomplete="tel" oninput="fixPhone(this)">'}
  <input id="a-pass" type="password" placeholder="Parol" autocomplete="${L?"current-password":"new-password"}">
  ${L?"":'<input id="a-pass2" type="password" placeholder="Parolni takrorlang" autocomplete="new-password">'}
  <p id="a-err" class="err"></p>
  <button id="a-btn" class="btn" style="width:100%" onclick="auth()">${L?"Kirish":"Ro‘yxatdan o‘tish"}</button>
  <p class="sub" style="margin-top:18px">${L?"Hisobingiz yo‘qmi?":"Hisobingiz bormi?"} <button class="lnk" onclick="mode='${L?"reg":"login"}';render()">${L?"Ro‘yxatdan o‘tish":"Kirish"}</button></p></div>`;
}
// +998 doim boshida turadi, keyin faqat raqam, jami 13 belgi
function fixPhone(el){
  let d=el.value.replace(/\D/g,"");
  if(d.startsWith("998")) d=d.slice(3);
  el.value="+998"+d.slice(0,9);
  const c=el.value.slice(4,6),e=$("a-err");
  if(e) e.textContent=c.length==2&&!UZ_CODES.includes(c)?`"${c}" — bunday operator kodi yo‘q`:"";
}
const phoneOk=v=>/^\+998\d{9}$/.test(v)&&UZ_CODES.includes(v.slice(4,6));
async function auth(){
  const n=$("a-name").value.trim().toLowerCase(),p=$("a-pass").value,err=t=>$("a-err").textContent=t;
  if(!/^[a-z0-9_.]{3,30}$/.test(n)) return err("Nom 3–30 belgi: lotin harf, raqam, _ yoki .");
  if(p.length<4) return err("Parol kamida 4 belgi bo‘lsin");
  let data={name:n,pass:p};
  if(mode=="reg"){
    const ph=$("a-phone").value.trim();
    if(!/^\+998\d{9}$/.test(ph)) return err("Telefon +998 bilan boshlanib, jami 13 belgi bo‘lsin (+998901234567)");
    if(!phoneOk(ph)) return err("Operator kodi xato. Ruxsat etilgan: "+UZ_CODES.join(", "));
    if(p!==$("a-pass2").value) return err("Parollar mos emas");
    data.phone=ph;
  }
  $("a-btn").disabled=true;
  try{
    const r=await api(mode=="reg"?"register":"login",data);
    me=r.user;token=r.token;saveSession();tab="home";await loadFeed();
  }catch(e){err(e.message);$("a-btn").disabled=false}
}
async function logout(){try{await A("logout",{},true)}catch(e){}clearSession();render()}

// ====== Lenta ======
function card(p){
  const liked=p.likes.includes(me);
  return `<article class="cd"><div class="md" style="background:${G[gi(p.id)]}" ondblclick="like(${p.id})">${media(p)}${p.type=="video"?'<i class="pl"></i>':""}</div>
  <div style="margin-top:8px">${tag(p.cat)}</div><h3 class="ct">${esc(p.title)}</h3>
  <div class="by">${ava(p.user)}@${esc(p.user)} · ${kfmt(p.views)} ko‘rish</div>
  <div class="ac"><button onclick="like(${p.id})">${ic("heart",liked?"f":"")}${p.likes.length}</button><button onclick="toggle(${p.id})">${ic("cmt")}${p.comments.length}</button><button onclick="share()">${ic("share")}Ulashish</button></div>
  ${open[p.id]?p.comments.map(c=>`<div class="cm"><b>${esc(c.u)}</b> ${esc(String(c.t).replace(/^'/,""))}</div>`).join("")+`<div class="cin"><input id="c-${p.id}" placeholder="Izoh qo‘shish..." maxlength="1000" onkeydown="if(event.key=='Enter')comment(${p.id})"><button class="btn" onclick="comment(${p.id})">OK</button></div>`:""}</article>`;
}
function homeView(){
  const ok=approved().slice().reverse();
  return `<div class="hero"><h2>Inson va<br>Fenomen</h2><small>Ijodiy tanlovlar va jurnal platformasi</small></div>
  <h3 class="sec">So‘nggi ishlar</h3>${ok.length?ok.map(card).join(""):'<p class="muted">Hozircha tasdiqlangan ish yo‘q.</p>'}`;
}
async function like(id){
  const p=posts.find(x=>x.id==id),i=p.likes.indexOf(me);
  i<0?p.likes.push(me):p.likes.splice(i,1);render(); // darhol ko'rsatamiz
  try{await A("like",{id},true)}catch(e){i<0?p.likes.splice(p.likes.indexOf(me),1):p.likes.push(me);render();alert(e.message)}
}
function toggle(id){open[id]=!open[id];render()}
async function comment(id){
  const el=$("c-"+id),t=el.value.trim();if(!t)return;
  el.disabled=true;
  try{await A("comment",{id,text:t},true);posts.find(x=>x.id==id).comments.push({u:me,t});render()}
  catch(e){el.disabled=false;alert(e.message)}
}
function share(){try{navigator.clipboard.writeText(location.href.split("#")[0]);alert("Havola nusxalandi")}catch(e){alert("Havolani manzil satridan nusxalang")}}

function tile(p,cls){return `<div class="tile ${cls||""}" style="background:${G[gi(p.id)]}">${media(p)}${p.type=="video"?'<i class="pl"></i>':""}<div class="ov">${esc(p.title)}<small>${catName(p.cat)} · @${esc(p.user)}</small></div></div>`}
function exploreView(){
  const list=approved().filter(p=>!cat||p.cat==cat);
  return `<h3 class="sec">Kategoriyalar va tanlovlar</h3>
  <div class="chips"><button class="chip ${cat?"":"on"}" onclick="cat=null;render()">Hammasi</button>${Object.keys(CATS).map(k=>`<button class="chip ${cat==k?"on":""}" onclick="cat='${k}';render()">${CATS[k][0]}</button>`).join("")}</div>
  ${list.length?`<div class="grid">${list.map(p=>tile(p)).join("")}</div>`:'<p class="muted">Bu kategoriyada hali ish yo‘q.</p>'}`;
}
function magView(){
  const s=approved().slice().sort((a,b)=>b.likes.length-a.likes.length);
  if(!s.length) return '<p class="muted">Jurnal uchun hali ish yo‘q.</p>';
  return `<h3 class="sec">Tanlangan ishlar</h3>${tile(s[0],"big")}<div class="grid">${s.slice(1).map(p=>tile(p)).join("")}</div>`;
}

// ====== Yuklash (fayl Drive'ga ZIP bo'lib boradi) ======
function addView(){
  return `<h3 class="sec">Ish yuklash</h3>
  <label>Sarlavha</label><input id="u-title" maxlength="200" placeholder="Masalan: Samarqand ko‘chalari">
  <label>Tanlov</label><select id="u-comp">${COMPS.map(c=>`<option>${c}</option>`).join("")}</select>
  <label>Kategoriya</label><select id="u-cat">${Object.keys(CATS).map(k=>`<option value="${k}">${CATS[k][0]}</option>`).join("")}</select>
  <label>Fayl (rasm, video yoki hujjat, ${MAX_MB} MB gacha)</label><input id="u-file" type="file">
  <p class="muted">Yuborilgan ish admin tasdiqlagandan so‘ng lentada ko‘rinadi.</p>
  <p id="u-err" class="err"></p>
  <div class="row"><button class="btn ghost" style="flex:1" onclick="go('home')">Bekor qilish</button><button id="u-btn" class="btn" style="flex:1" onclick="submitWork()">Yuklash</button></div>`;
}
const toB64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=()=>no(new Error("Faylni o‘qib bo‘lmadi"));r.readAsDataURL(f)});
async function submitWork(){
  const title=$("u-title").value.trim(),c=$("u-cat").value,comp=$("u-comp").value,f=$("u-file").files[0],err=t=>$("u-err").textContent=t;
  if(!title) return err("Sarlavha kiriting");
  if(!f) return err("Fayl tanlang");
  if(f.size>MAX_MB*1024*1024) return err(`Fayl ${MAX_MB} MB dan katta`);
  const b=$("u-btn");b.disabled=true;b.textContent="Yuborilmoqda…";
  try{
    await A("upload",{title,cat:c,comp,name:f.name,mime:f.type,data:await toB64(f)});
    tab="me";await loadFeed();
  }catch(e){err(e.message);b.disabled=false;b.textContent="Yuklash"}
}

const SL={pending:"Kutilmoqda",approved:"Tasdiqlangan",rejected:"Rad etilgan"},SC={pending:"#77746B",approved:"#2E7D4F",rejected:"#C0392B"};
function profileView(){
  const mine=posts.filter(p=>p.user==me),lk=mine.reduce((a,p)=>a+p.likes.length,0);
  return `<div class="row" style="justify-content:flex-start;gap:16px;margin:8px 0 18px">${ava(me,"width:72px;height:72px;font-size:28px")}<div><div class="serif" style="font-size:24px">${esc(me)}</div><div class="muted">${mine.length} ta ish · ${lk} ta yoqtirish</div></div></div>
  <h3 class="sec">Mening ishlarim</h3>${mine.length?mine.slice().reverse().map(p=>`<div class="item row"><div class="row" style="justify-content:flex-start"><div class="th" style="background:${G[gi(p.id)]}">${p.preview?`<img src="${esc(p.preview)}" alt="" referrerpolicy="no-referrer">`:""}</div><div style="font-size:14px">${esc(p.title)}<div class="muted">${catName(p.cat)}</div></div></div><span class="pill" style="background:${SC[p.status]}">${SL[p.status]}</span></div>`).join(""):'<p class="muted">Hali ish yuborilmagan.</p>'}`;
}

// ====== ADMIN (#daxshat + Apps Script'dagi ADMIN_KEY) ======
const akey=()=>{try{return sessionStorage.getItem("akey")}catch(e){return null}};
async function adminLogin(){
  const k=$("ak").value;
  try{const r=await api("admin",{key:k});try{sessionStorage.setItem("akey",k)}catch(e){}adm=r;render()}
  catch(e){$("ak-err").textContent=e.message}
}
async function adminLoad(){try{adm=await api("admin",{key:akey()})}catch(e){try{sessionStorage.removeItem("akey")}catch(_){}adm=null}render()}
function renderAdmin(){
  if(!akey()||!adm){
    if(akey()&&!adm&&!busy){busy=true;adminLoad().finally(()=>busy=false);$("app").innerHTML='<div class="adm"><p class="muted">Yuklanmoqda…</p></div>';return}
    $("app").innerHTML=`<div class="auth"><h1 style="font-size:28px">Admin</h1><input id="ak" type="password" placeholder="Admin kaliti" onkeydown="if(event.key=='Enter')adminLogin()"><p id="ak-err" class="err"></p><button class="btn" style="width:100%" onclick="adminLogin()">Kirish</button><p class="sub" style="margin-top:14px"><button class="lnk" onclick="location.hash=''">← Saytga qaytish</button></p></div>`;return;
  }
  const pend=adm.posts.filter(p=>p.status=="pending");
  $("app").innerHTML=`<div class="adm"><div class="row"><h1 style="font-size:26px;margin:0">${NAME} · Admin</h1><span class="pill" style="background:#C0392B">ADMIN</span></div>
  <div class="row" style="margin:14px 0">${[[adm.users.length,"Foydalanuvchilar"],[adm.posts.length,"Jami ishlar"],[pend.length,"Kutilmoqda"]].map(s=>`<div class="item" style="flex:1;margin:0"><div class="serif" style="font-size:26px">${s[0]}</div><div class="muted">${s[1]}</div></div>`).join("")}</div>
  <div class="row"><h3 class="sec">Moderatsiya</h3><button class="lnk" onclick="adminLoad()">Yangilash</button></div>
  ${pend.length?pend.map(p=>`<div class="item row"><div class="row" style="justify-content:flex-start"><div class="th" style="background:${G[gi(p.id)]}">${p.preview?`<img src="${esc(p.preview)}" alt="" referrerpolicy="no-referrer">`:""}</div><div style="font-size:14px">${esc(p.title)}<div class="muted">@${esc(p.user)} · ${catName(p.cat)} · ${esc(p.comp)}</div><a class="dl" href="${esc(p.zip)}" target="_blank" rel="noopener">ZIP faylni ochish (Drive)</a></div></div><div style="display:flex;gap:6px"><button class="btn g" aria-label="Tasdiqlash" onclick="mod(${p.id},'approved')">✓</button><button class="btn r" aria-label="Rad etish" onclick="mod(${p.id},'rejected')">✕</button></div></div>`).join(""):'<p class="muted">Kutayotgan ish yo‘q.</p>'}
  <h3 class="sec">Ro‘yxatdan o‘tganlar</h3>
  ${adm.users.length?adm.users.map(u=>`<div class="item row"><span>${ava(u.name)} @${esc(u.name)} <span class="muted">${esc(u.phone)}</span></span><span class="muted">${new Date(u.at).toLocaleDateString()}</span></div>`).join(""):'<p class="muted">Hali hech kim yo‘q.</p>'}
  <div class="row"><button class="lnk" onclick="location.hash=''">← Saytga qaytish</button><button class="lnk" onclick="try{sessionStorage.removeItem('akey')}catch(e){};adm=null;render()">Admindan chiqish</button></div></div>`;
}
async function mod(id,s){try{await api("moderate",{key:akey(),id,status:s});await adminLoad()}catch(e){alert(e.message)}}

window.addEventListener("hashchange",()=>{if(!isAdmin()&&me)loadFeed();else render()});
me?loadFeed():render();
</script>
